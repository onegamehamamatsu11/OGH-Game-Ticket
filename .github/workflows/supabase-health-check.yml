
name: Supabase 自動稼働確認

on:
  schedule:
    # 日本時間 09:00 / 13:00 / 18:00
    - cron: "0 0,4,9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    name: Supabase 稼働確認
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Supabase REST API 応答確認
        env:
          SUPABASE_URL: https://oranxqywopnabesvwmys.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          import urllib.request
          import urllib.error

          base_url = os.environ["SUPABASE_URL"]
          api_key = os.environ.get(
              "SUPABASE_PUBLISHABLE_KEY", ""
          )

          if not api_key.startswith("sb_publishable_"):
              print("ERROR: Publishable key が未設定です")
              sys.exit(1)

          url = base_url + "/rest/v1/"

          request = urllib.request.Request(
              url,
              headers={
                  "apikey": api_key
              },
              method="GET"
          )

          try:
              with urllib.request.urlopen(
                  request,
                  timeout=20
              ) as response:
                  print(
                      "Supabase HTTP Status:",
                      response.status
                  )
                  print("Supabase REST API 正常応答")

          except urllib.error.HTTPError as error:
              print("ERROR: HTTP", error.code)
              sys.exit(1)

          except Exception as error:
              print("ERROR:", str(error))
              sys.exit(1)
          PY
