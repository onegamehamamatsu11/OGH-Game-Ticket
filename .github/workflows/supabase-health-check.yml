
name: Supabase データベース自動稼働確認

on:
  schedule:
    # 日本時間 00:07 / 03:07 / 06:07 / 09:07
    #          12:07 / 15:07 / 18:07 / 21:07
    - cron: "7 */3 * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    name: Supabase DB稼働確認
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: データベース接続確認
        env:
          FUNCTION_URL: https://oranxqywopnabesvwmys.supabase.co/functions/v1/database-health-check
          HEALTH_CHECK_SECRET: ${{ secrets.HEALTH_CHECK_SECRET }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          import urllib.error

          url = os.environ["FUNCTION_URL"]
          secret = os.environ["HEALTH_CHECK_SECRET"]

          if not secret:
              print("ERROR: HEALTH_CHECK_SECRET is missing")
              sys.exit(1)

          request = urllib.request.Request(
              url,
              data=b"{}",
              headers={
                  "Content-Type": "application/json",
                  "x-health-check-secret": secret
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(
                  request,
                  timeout=20
              ) as response:
                  body = response.read().decode("utf-8")
                  result = json.loads(body)

                  if (
                      response.status == 200
                      and result.get("ok") is True
                      and result.get("database") == "connected"
                  ):
                      print("SUCCESS: Supabase database connected")
                  else:
                      print("ERROR: Unexpected database response")
                      sys.exit(1)

          except urllib.error.HTTPError as error:
              print("ERROR: HTTP", error.code)
              sys.exit(1)

          except Exception as error:
              print("ERROR:", str(error))
              sys.exit(1)
          PY
