
name: Supabase 自動稼働確認

on:
  schedule:
    # 日本時間 09:00 / 13:00 / 17:00
    # UTC 00:00 / 04:00 / 08:00
    - cron: "0 0,4,8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    name: Supabase 稼働確認
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Supabase Edge Function 応答確認
        env:
          FUNCTION_URL: https://oranxqywopnabesvwmys.supabase.co/functions/v1/check-game-ticket
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          import urllib.error

          url = os.environ["FUNCTION_URL"]

          # 実在するQRコードを使わずに
          # 認証関数の応答を確認する
          payload = json.dumps({
              "token": "health-check"
          }).encode("utf-8")

          request = urllib.request.Request(
              url,
              data=payload,
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(
                  request,
                  timeout=20
              ) as response:
                  status = response.status
                  body = response.read().decode("utf-8")

                  print("HTTP Status:", status)

                  result = json.loads(body)

                  if isinstance(result, dict) and (
                      "valid" in result or
                      "allowed" in result
                  ):
                      print("Edge Function 応答確認成功")
                  else:
                      print("ERROR: 想定外の応答形式")
                      sys.exit(1)

          except urllib.error.HTTPError as error:
              print("ERROR: HTTP", error.code)
              sys.exit(1)

          except Exception as error:
              print("ERROR:", str(error))
              sys.exit(1)
          PY
