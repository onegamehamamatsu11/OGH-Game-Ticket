
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10182b">
  <title>ONEGAME浜松 | QRゲーム認証</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: linear-gradient(160deg, #10182b, #243b65);
      color: #ffffff;
      font-family: system-ui, sans-serif;
      text-align: center;
    }

    main {
      width: 100%;
      max-width: 440px;
      padding: 32px 22px;
      background: #202e4a;
      border: 1px solid #425779;
      border-radius: 22px;
    }

    h1 {
      font-size: 28px;
      margin: 0 0 8px;
    }

    h2 {
      font-size: 20px;
      margin: 0 0 24px;
    }

    p {
      line-height: 1.8;
    }

    .status {
      font-size: 18px;
      font-weight: 700;
    }

    .success {
      color: #7df0b5;
    }

    .error {
      color: #ffaaa9;
    }

    .muted {
      color: #c7d4ea;
      font-size: 14px;
    }

    button {
      border: 0;
      border-radius: 12px;
      background: #7df0b5;
      color: #102139;
      font-size: 17px;
      font-weight: bold;
      padding: 14px 24px;
      cursor: pointer;
      width: 100%;
      margin-top: 16px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #8193b2;
      background: #10182b;
      color: #ffffff;
      font-size: 16px;
    }

    .hidden {
      display: none;
    }

    .timebox {
      margin-top: 16px;
      padding: 14px;
      border: 1px solid #617696;
      border-radius: 12px;
      background: #17243c;
    }

    .game-name {
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <main>
    <h1>ONEGAME浜松</h1>
    <h2>QRゲーム認証</h2>

    <p id="status" class="status">
      認証の準備をしています...
    </p>

    <p id="detail" class="muted"></p>

    <div id="manual" class="hidden">
      <p>QRコードに記載された専用コードを入力してください。</p>

      <input
        id="tokenInput"
        type="text"
        placeholder="64文字の専用コード"
        maxlength="64"
        autocomplete="off"
        spellcheck="false"
      >

      <button id="checkButton" type="button">
        認証する
      </button>
    </div>

    <div id="approved" class="hidden">
      <p id="gameName" class="game-name"></p>

      <div class="timebox">
        <p id="timeText"></p>
        <p id="remainingText" class="success"></p>
      </div>

      <button id="openButton" type="button">
        ゲームを開く
      </button>

      <p class="muted">
        初回認証から60分間、何度でもゲームを開けます。
      </p>
    </div>
  </main>

  <script>
    "use strict";

    const CHECK_URL =
      "https://oranxqywopnabesvwmys.supabase.co/functions/v1/check-game-ticket";

    // ゲームIDと表示名
    const gameNames = {
      "bomb-dodging": "爆弾避け",
      "endless-jump": "エンドレスジャンプ",
      "reaction-game": "反射神経ゲーム",
      "button-mashing-game": "ボタン連打ゲーム"
    };

    // ゲームIDと公開URL
    const gameUrls = {
      "bomb-dodging":
        "https://onegamehamamatsu11.github.io/Bomb-Dodging/",

      "endless-jump":
        "https://onegamehamamatsu11.github.io/Endless-Jump/",

      "reaction-game":
        "https://onegamehamamatsu11.github.io/ReflexesGame/",

      "button-mashing-game":
        "https://onegamehamamatsu11.github.io/Button-Mashing-game/"
    };

    const statusEl = document.getElementById("status");
    const detailEl = document.getElementById("detail");
    const manualEl = document.getElementById("manual");
    const approvedEl = document.getElementById("approved");

    const tokenInput = document.getElementById("tokenInput");
    const checkButton = document.getElementById("checkButton");
    const openButton = document.getElementById("openButton");

    const gameNameEl = document.getElementById("gameName");
    const timeText = document.getElementById("timeText");
    const remainingText = document.getElementById("remainingText");

    let currentGameId = "";
    let currentToken = "";
    let resumeUntil = null;
    let countdownTimer = null;
    let verificationSequence = 0;

    function showStatus(message, type = "", detail = "") {
      statusEl.textContent = message;
      statusEl.className = "status " + type;
      detailEl.textContent = detail;
    }

    function stopCountdown() {
      if (countdownTimer !== null) {
        clearInterval(countdownTimer);
        countdownTimer = null;
      }
    }

    function expireSession() {
      stopCountdown();
      resumeUntil = null;
      currentGameId = "";
      currentToken = "";
      approvedEl.classList.add("hidden");

      showStatus(
        "利用時間が終了しました",
        "error",
        "初回認証から60分が経過したため、このQRコードは利用できません。"
      );
    }

    function updateRemainingTime() {
      if (!resumeUntil) return;

      const milliseconds =
        resumeUntil.getTime() - Date.now();

      if (milliseconds <= 0) {
        expireSession();
        return;
      }

      const totalSeconds = Math.ceil(milliseconds / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;

      remainingText.textContent =
        "残り時間：" +
        minutes +
        "分" +
        String(seconds).padStart(2, "0") +
        "秒";
    }

    function startCountdown(until) {
      stopCountdown();

      resumeUntil = new Date(until);

      if (Number.isNaN(resumeUntil.getTime())) {
        resumeUntil = null;
        approvedEl.classList.add("hidden");

        showStatus(
          "認証エラー",
          "error",
          "利用期限を取得できませんでした。"
        );
        return;
      }

      timeText.textContent =
        "利用期限：" +
        resumeUntil.toLocaleString("ja-JP", {
          timeZone: "Asia/Tokyo",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        });

      updateRemainingTime();

      if (resumeUntil) {
        countdownTimer = setInterval(
          updateRemainingTime,
          1000
        );
      }
    }

    async function requestVerification(token) {
      const response = await fetch(CHECK_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        cache: "no-store",
        body: JSON.stringify({ token })
      });

      const result = await response.json();

      if (!response.ok) {
        throw new Error(
          result.error || "通信エラーが発生しました。"
        );
      }

      return result;
    }

    async function verifyToken(token) {
      const sequence = ++verificationSequence;
      const normalized = token.trim().toLowerCase();

      stopCountdown();
      resumeUntil = null;
      currentGameId = "";
      currentToken = "";
      approvedEl.classList.add("hidden");

      if (!/^[a-f0-9]{64}$/.test(normalized)) {
        showStatus(
          "認証できません",
          "error",
          "専用コードは64文字の英数字で入力してください。"
        );
        return;
      }

      checkButton.disabled = true;
      showStatus("QRコードを確認しています...");

      try {
        const result = await requestVerification(normalized);

        if (sequence !== verificationSequence) return;

        if (!result.valid || !result.allowed) {
          showStatus(
            "認証できません",
            "error",
            result.message || "このQRコードは利用できません。"
          );
          return;
        }

        if (!result.game_id || !result.resume_until) {
          throw new Error("認証結果が不完全です。");
        }

        if (!gameUrls[result.game_id]) {
          showStatus(
            "ゲーム未登録",
            "error",
            "このQRコードに対応するゲームは現在登録されていません。"
          );
          return;
        }

        currentGameId = result.game_id;
        currentToken = normalized;

        gameNameEl.textContent =
          "対象ゲーム：" + gameNames[currentGameId];

        manualEl.classList.add("hidden");
        approvedEl.classList.remove("hidden");

        showStatus(
          "認証成功！",
          "success",
          result.message || "ゲームを開けます。"
        );

        startCountdown(result.resume_until);

      } catch (error) {
        if (sequence !== verificationSequence) return;

        console.error("認証エラー:", error);

        showStatus(
          "認証エラー",
          "error",
          error.message || "認証処理に失敗しました。"
        );
      } finally {
        if (sequence === verificationSequence) {
          checkButton.disabled = false;
        }
      }
    }

    async function openGame() {
      if (
        !currentGameId ||
        !currentToken ||
        !resumeUntil
      ) {
        return;
      }

      if (Date.now() >= resumeUntil.getTime()) {
        expireSession();
        return;
      }

      const gameId = currentGameId;
      const token = currentToken;
      const url = gameUrls[gameId];

      if (!url) {
        showStatus(
          "ゲームURL未登録",
          "error",
          "このゲームの公開URLはまだ登録されていません。"
        );
        return;
      }

      openButton.disabled = true;
      showStatus("利用期限を確認しています...");

      try {
        const result = await requestVerification(token);

        if (
          !result.valid ||
          !result.allowed ||
          result.game_id !== gameId ||
          !result.resume_until
        ) {
          expireSession();
          return;
        }

        const serverUntil = new Date(
          result.resume_until
        );

        if (
          Number.isNaN(serverUntil.getTime()) ||
          Date.now() >= serverUntil.getTime()
        ) {
          expireSession();
          return;
        }

        // 認証成功後、対象のゲームを開く
        window.location.href = url;

      } catch (error) {
        console.error("ゲーム起動エラー:", error);

        showStatus(
          "通信エラー",
          "error",
          "ゲームを開く前の認証に失敗しました。"
        );
      } finally {
        openButton.disabled = false;
      }
    }

    checkButton.addEventListener("click", () => {
      verifyToken(tokenInput.value);
    });

    tokenInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        verifyToken(tokenInput.value);
      }
    });

    openButton.addEventListener("click", openGame);

    const params = new URLSearchParams(location.search);
    const urlToken = params.get("token");

    if (urlToken) {
      manualEl.classList.add("hidden");
      verifyToken(urlToken);
    } else {
      showStatus(
        "QRコード認証",
        "",
        "専用コードを入力して認証を確認できます。"
      );

      manualEl.classList.remove("hidden");
    }
  </script>
</body>
</html>
